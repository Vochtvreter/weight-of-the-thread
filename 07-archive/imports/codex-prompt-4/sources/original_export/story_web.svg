<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 8; }
    .chapter { fill: none; stroke: #666; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .arrow { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #111; text-anchor: middle; }
    .sub { font-family: Arial, sans-serif; font-size: 11px; fill: #444; text-anchor: middle; }
    .chaplabel { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #333; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#222"/>
    </marker>
  </defs>

  <!-- Chapter 1 box -->
  <rect class="chapter" x="50" y="40" width="800" height="320"/>
  <text class="chaplabel" x="450" y="30">Chapter 1</text>

  <!-- A -->
  <rect class="box" x="300" y="60" width="300" height="70"/>
  <text class="label" x="450" y="90">A The Valve</text>
  <text class="sub" x="450" y="110">Lena sees gel forfeiture but</text>
  <text class="sub" x="450" y="124">imminent deaths force bypass</text>

  <!-- Arrow A to B -->
  <line class="arrow" x1="450" y1="130" x2="450" y2="170"/>
  <text class="sub" x="470" y="155">THEREFORE</text>

  <!-- B -->
  <rect class="box" x="300" y="170" width="300" height="60"/>
  <text class="label" x="450" y="195">B The Empty Rack</text>
  <text class="sub" x="450" y="215">Elias + Marcus, gel at zero</text>

  <!-- Arrow B to C -->
  <line class="arrow" x1="450" y1="230" x2="450" y2="270"/>
  <text class="sub" x="470" y="255">THEREFORE</text>

  <!-- C -->
  <rect class="box" x="300" y="270" width="300" height="70"/>
  <text class="label" x="450" y="300">C Lena After</text>
  <text class="sub" x="450" y="320">silence about the trap</text>
  <text class="sub" x="450" y="334">she already sees</text>

  <!-- Chapter 2 -->
  <rect class="chapter" x="550" y="400" width="300" height="180"/>
  <text class="chaplabel" x="700" y="395">Chapter 2</text>

  <!-- Arrow C to D -->
  <path class="arrow" d="M450 340 L450 420 L700 420 L700 450"/>
  <text class="sub" x="580" y="410">THEREFORE</text>

  <!-- D -->
  <rect class="box" x="575" y="450" width="250" height="70"/>
  <text class="label" x="700" y="480">D The Second Call</text>
  <text class="sub" x="700" y="500">decision then suicide</text>

  <!-- Chapter 3 -->
  <rect class="chapter" x="50" y="620" width="500" height="200"/>
  <text class="chaplabel" x="300" y="610">Chapter 3</text>

  <!-- Arrow D to E/F area -->
  <path class="arrow" d="M700 520 L700 600 L300 600 L300 650"/>
  <text class="sub" x="500" y="590">THEREFORE</text>

  <!-- E -->
  <rect class="box" x="80" y="650" width="200" height="70"/>
  <text class="label" x="180" y="680">E The Pattern</text>
  <text class="sub" x="180" y="700">resonance found,</text>
  <text class="sub" x="180" y="714">protocol reconstructed</text>

  <!-- Arrow E to F -->
  <line class="arrow" x1="280" y1="685" x2="340" y2="685"/>
  <text class="sub" x="310" y="675">THEREFORE</text>

  <!-- F -->
  <rect class="box" x="340" y="650" width="180" height="70"/>
  <text class="label" x="430" y="680">F Inventory</text>
  <text class="sub" x="430" y="700">logs confirm zero,</text>
  <text class="sub" x="430" y="714">cannot send</text>

  <!-- Chapter 4 -->
  <rect class="chapter" x="600" y="850" width="250" height="150"/>
  <text class="chaplabel" x="725" y="840">Chapter 4</text>

  <!-- Arrow F to G -->
  <path class="arrow" d="M430 720 L430 800 L725 800 L725 870"/>
  <text class="sub" x="580" y="790">THEREFORE</text>

  <!-- G -->
  <rect class="box" x="625" y="870" width="200" height="70"/>
  <text class="label" x="725" y="900">G The Blister</text>
  <text class="sub" x="725" y="920">Elias writes while</text>
  <text class="sub" x="725" y="934">Earth dies</text>
</svg>
